[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plq"
version = "2.5.0"
description = "Pharmacological Lattice Quantization (PLQ) with ToposLang and Geometric Native Coding"
authors = [
    { name = "Elias Oulad Brahim", email = "obe@cloudhabil.com" }
]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.scripts]
plq = "plq.cli:main"
plq-test = "plq.cli:run_tests"
plq-phases = "plq.cli:run_all_5_phases"
